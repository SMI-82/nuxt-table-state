# Stages a release on npm when a version tag (v1.2.3) is pushed.
# Auth is npm trusted publishing (OIDC): no token is stored anywhere.
# A maintainer then approves it with 2FA (npmjs.com → Staged Packages, or npm stage approve).
name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # npm stage needs npm 12.
      - run: npm install -g npm@12

      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: npm ci

      # The build extends .nuxt/tsconfig.json, which only this step generates.
      - run: npm run dev:prepare

      # prepublishOnly runs the tests, prepack builds dist/.
      - run: npm stage publish
